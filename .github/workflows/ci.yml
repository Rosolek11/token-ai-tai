name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run tests
        run: python -m pytest
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Run frontend behavior tests
        run: node --test tests/market_report.test.cjs tests/report_intro.test.cjs
